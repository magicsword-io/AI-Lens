# OPTIONAL: direct credential-store checks plus shell-reference visibility.
# Legitimate authenticated workflows can match. Review before enabling blocks.
version: 1
rules:
  - id: cred-cloud-stores
    description: Direct file-tool access to common AWS, Azure, and gcloud auth stores.
    tool_pattern: '(?i)^(read|write|edit|multiedit|read_file|write_file|edit_file|replace|apply_patch|patch|view|create|str_replace_editor)$'
    path_pattern: '(?i)(^|/)(\.aws/(credentials|config)|\.azure/(accessTokens\.json|msal_token_cache\.(json|bin))|gcloud/(application_default_credentials\.json|credentials\.db|access_tokens\.db))$'
    action: block

  - id: cred-kube-config
    description: Direct file-tool access to the default Kubernetes client configuration.
    tool_pattern: '(?i)^(read|write|edit|multiedit|read_file|write_file|edit_file|replace|apply_patch|patch|view|create|str_replace_editor)$'
    path_pattern: '(?i)(^|/)\.kube/config$'
    action: block

  - id: cred-package-vcs-stores
    description: Direct file-tool access to common package, registry, and Git auth files.
    tool_pattern: '(?i)^(read|write|edit|multiedit|read_file|write_file|edit_file|replace|apply_patch|patch|view|create|str_replace_editor)$'
    path_pattern: '(?i)(^|/)(\.docker/config\.json|\.npmrc|\.pypirc|\.git-credentials|\.netrc|_netrc|gh/hosts\.ya?ml)$'
    action: block

  - id: cred-ssh-private-keys
    description: Direct file-tool access to default SSH private-key filenames.
    tool_pattern: '(?i)^(read|write|edit|multiedit|read_file|write_file|edit_file|replace|apply_patch|patch|view|create|str_replace_editor)$'
    path_pattern: '(?i)(^|/)\.ssh/id_(rsa|dsa|ecdsa|ed25519)$'
    action: block

  - id: cred-shell-store-references
    description: Audit literal shell references to the illustrated credential stores.
    tool_pattern: '(?i)^(bash|powershell|shell|terminal|exec_command|shell_command|run_command|run_shell_command)$'
    content_pattern: '(?i)(^|[^A-Za-z0-9_])(\.aws[/\\](credentials|config)|\.azure[/\\](accessTokens\.json|msal_token_cache\.(json|bin))|gcloud[/\\](application_default_credentials\.json|credentials\.db|access_tokens\.db)|\.kube[/\\]config|\.docker[/\\]config\.json|\.npmrc|\.pypirc|\.git-credentials|\.netrc|_netrc|gh[/\\]hosts\.ya?ml|\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519))([^A-Za-z0-9_.-]|$)'
    action: audit
